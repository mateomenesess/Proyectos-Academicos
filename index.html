<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.1/css/all.min.css" integrity="sha512-MV7K8+y+gLIBoVD59lQIYicR65iaqukzvf/nwasF0nqhPay5w/9lJmVM2hMDcnK1OnMGCdVK+iQrJ7lzPJQd1w==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="estilo.css">
    <script src="app.js" async></script>
    <title>Tienda de Videojuegos | </title>
</head>
<body>
    <header>
        <h1>Tienda de Videojuegos</h1>
    </header>
    <section class="contenedor">
        <!-- Contenedor de elementos -->
        <div class="contenedor-items">
            <div class="item">
                <span class="titulo-item">Days gone</span>
                <img src="img/juego1.png" alt="" class="img-item">
                <span class="precio-item">$150.000</span>
                <button class="boton-item">Agregar al Carrito</button>
            </div>
            <div class="item">
                <span class="titulo-item">Horizon Zero Dawn</span>
                <img src="img/juego2.jpg" alt="" class="img-item">
                <span class="precio-item">$150.000</span>
                <button class="boton-item">Agregar al Carrito</button>
            </div>
            <div class="item">
                <span class="titulo-item">Call of duty Warzone</span>
                <img src="img/juego3.png" alt="" class="img-item">
                <span class="precio-item">$150.000</span>
                <button class="boton-item">Agregar al Carrito</button>
            </div>
            <div class="item">
                <span class="titulo-item">God of War</span>
                <img src="img/juego4.jpg" alt="" class="img-item">
                <span class="precio-item">$180.000</span>
                <button class="boton-item">Agregar al Carrito</button>
            </div>
            <div class="item">
                <span class="titulo-item">Forza Horizon</span>
                <img src="img/juego5.jpg" alt="" class="img-item">
                <span class="precio-item">$120.000</span>
                <button class="boton-item">Agregar al Carrito</button>
            </div>
            <div class="item">
                <span class="titulo-item">Resident Evil Village</span>
                <img src="img/juego6.jpg" alt="" class="img-item">
                <span class="precio-item">$180.000</span>
                <button class="boton-item">Agregar al Carrito</button>
            </div>
            
            <div class="item">
                <span class="titulo-item">Assassins Creed</span>
                <img src="img/juego8.jpg" alt="" class="img-item">
                <span class="precio-item">$140.000</span>
                <button class="boton-item">Agregar al Carrito</button>
            </div>
            <div class="item">
                <span class="titulo-item">HALO Infinite</span>
                <img src="img/juego9.webp" alt="" class="img-item">
                <span class="precio-item">$150.000</span>
                <button class="boton-item">Agregar al Carrito</button>
            </div>
        </div>
        <!-- Carrito de Compras -->
        <div class="carrito" id="carrito">
            <div class="header-carrito">
                <h2>Tu Carrito</h2>
            </div>

            <div class="carrito-items">
                
            </div>
            <div class="carrito-total">
                <div class="fila">
                    <strong>Tu Total</strong>
                    <span class="carrito-precio-total">
                        $120.000,00
                    </span>
                </div>
                <button class="btn-pagar">Pagar <i class="fa-solid fa-bag-shopping"></i> </button>
            </div>
        </div>
    </section>

    <footer>
        <h3>Creado por Mateo Meneses &#169;</h3>
    </footer>
    <br><br>
</body>
</html>
